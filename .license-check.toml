# All files are included by default — only exclusions need to be configured.
# Patterns use Python pathlib glob syntax (** matches across directory boundaries).
# To adjust which files are checked, edit exclude_patterns below.

copyright_marker = "Copyright 2026 Datastrato, Inc."

exclude_patterns = [
    # Version control
    ".git/**/*",
    "**/.gitignore",
    "**/.gitkeep",

    # Virtual environment and worktrees
    "**/.venv/**/*",
    ".worktrees/**/*",

    # IDE settings
    ".vscode/**/*",

    # Cache and build directories
    "**/__pycache__/**/*",
    "**/.pytest_cache/**/*",
    "**/.ruff_cache/**/*",
    "**/.mypy_cache/**/*",
    "**/dist/**/*",

    # Non-source text files
    "**/*.md",
    "**/*.lock",
    "**/*.txt",
    "**/*.cfg",
    "**/*.ini",

    # Data, schema, and config files
    "**/*.json",
    "**/*.yaml",
    "schema/**/*",

    # Log files
    "**/*.log",

    # Binary and compiled files
    "**/*.whl",
    "**/*.gz",
    "**/*.pyc",
    "**/*.pyo",
    "**/*.so",
    "**/*.pem",
    "**/*.png",
    "**/*.jpg",
    "**/*.ico",

    # Type stub marker (PEP 561)
    "**/*.typed",

    # License and notice files
    "LICENSE",
    "NOTICE",

    # GitHub issue templates (workflow YMLs are still checked)
    ".github/ISSUE_TEMPLATE/**/*",
]
