services:
  # mcp-runtime:
  #   build:
  #     context: .
  #   container_name: adp-mcp-runtime
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     pgvector:
  #       condition: service_healthy
  #     mongodb:
  #       condition: service_healthy
  #   volumes:
  #     - ./config:/opt/adp/config:ro
  #     - ./localfs:/opt/adp/localfs
