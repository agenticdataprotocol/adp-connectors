# ADP Hypervisor Logging Configuration
#
# Loaded automatically by adp_hypervisor at startup. Edit this file to
# customise log verbosity or output targets, then restart the stack.
#
# Log files are written to /opt/adp/logs/ inside the container, which is
# mounted to ./logs/ on the host so they persist across restarts.

version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
    datefmt: "%Y-%m-%dT%H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    stream: ext://sys.stderr

  file_handler:
    class: logging.handlers.RotatingFileHandler
    formatter: standard
    filename: /opt/adp/logs/hypervisor.log
    maxBytes: 10485760   # 10 MB
    backupCount: 5
    encoding: utf-8

root:
  level: INFO
  handlers:
    - console
    - file_handler
