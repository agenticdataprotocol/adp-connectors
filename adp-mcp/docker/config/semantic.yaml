version: "1.0.0"

resources:
  - resourceId: "demo:customers"
    intentClasses: ["LOOKUP", "QUERY"]
    version: 1
    description: "Customer profiles"
    backendId: "pg_demo"
    sourceDefinition:
      source: "customers"
      fields:
        - fieldId: "id"
          type: "INTEGER"
          description: "Unique customer identifier"
        - fieldId: "name"
          type: "STRING"
          description: "Full name"
        - fieldId: "email"
          type: "STRING"
          description: "Email address"
        - fieldId: "city"
          type: "STRING"
          description: "City of residence"
        - fieldId: "created_at"
          type: "TIMESTAMP"
          description: "Account creation time"

  - resourceId: "demo:products"
    intentClasses: ["LOOKUP", "QUERY"]
    version: 1
    description: "Product catalog"
    backendId: "pg_demo"
    sourceDefinition:
      source: "products"
      fields:
        - fieldId: "id"
          type: "INTEGER"
          description: "Unique product identifier"
        - fieldId: "name"
          type: "STRING"
          description: "Product name"
        - fieldId: "category"
          type: "STRING"
          description: "Product category"
        - fieldId: "price"
          type: "FLOAT"
          description: "Unit price"
        - fieldId: "in_stock"
          type: "BOOLEAN"
          description: "Whether the product is currently in stock"

  - resourceId: "demo:orders"
    intentClasses: ["LOOKUP", "QUERY"]
    version: 1
    description: "Customer orders"
    backendId: "pg_demo"
    sourceDefinition:
      source: "orders"
      fields:
        - fieldId: "id"
          type: "INTEGER"
          description: "Unique order identifier"
        - fieldId: "customer_id"
          type: "INTEGER"
          description: "Reference to the customer"
        - fieldId: "product_id"
          type: "INTEGER"
          description: "Reference to the product"
        - fieldId: "quantity"
          type: "INTEGER"
          description: "Number of items ordered"
        - fieldId: "total"
          type: "FLOAT"
          description: "Total amount"
        - fieldId: "status"
          type: "STRING"
          description: "Order status (pending, shipped, delivered, cancelled)"
        - fieldId: "ordered_at"
          type: "TIMESTAMP"
          description: "Time the order was placed"

  - resourceId: "demo:items"
    intentClasses: ["LOOKUP", "QUERY"]
    version: 1
    description: "Product catalog with semantic embeddings for similarity search"
    backendId: "pgvector_demo"
    sourceDefinition:
      source: "items"
      fields:
        - fieldId: "id"
          type: "INTEGER"
          description: "Unique item identifier"
        - fieldId: "title"
          type: "STRING"
          description: "Item title"
        - fieldId: "category"
          type: "STRING"
          description: "Item category"
        - fieldId: "price"
          type: "FLOAT"
          description: "Unit price"
        - fieldId: "embedding"
          type: "VECTOR"
          description: "3-D semantic embedding [tech, office, home]"
          constraints:
            vector:
              dimensions: 3
              distance_function: "COSINE"

  - resourceId: "demo:customer_profiles"
    intentClasses: ["LOOKUP", "QUERY"]
    version: 1
    description: "Customer CRM profiles stored in MongoDB"
    backendId: "mongo_demo"
    sourceDefinition:
      source: "customer_profiles"
      fields:
        - fieldId: "customer_id"
          type: "INTEGER"
          description: "Customer identifier matching the PostgreSQL customers table"
        - fieldId: "email"
          type: "STRING"
          description: "Customer email address (unique lookup key)"
        - fieldId: "name"
          type: "STRING"
          description: "Customer full name"
        - fieldId: "segment"
          type: "STRING"
          description: "Customer segment (premium, standard, enterprise)"
        - fieldId: "lifetime_value"
          type: "FLOAT"
          description: "Total value of all non-cancelled orders"
        - fieldId: "churn_risk"
          type: "STRING"
          description: "Churn risk level (low, medium, high)"
        - fieldId: "last_purchase_days_ago"
          type: "INTEGER"
          description: "Days since the customer's most recent order"

  - resourceId: "demo:invoices"
    intentClasses: ["LOOKUP", "QUERY", "INGEST", "REVISE"]
    version: 1
    description: "Order invoice files stored on the local filesystem, organised by fulfilment status"
    backendId: "localfs_demo"
    sourceDefinition:
      source: "invoices"

  - resourceId: "demo:notes"
    intentClasses: ["LOOKUP", "QUERY", "INGEST", "REVISE"]
    version: 1
    description: "Analyst notes and customer outreach records stored on the local filesystem"
    backendId: "localfs_demo"
    sourceDefinition:
      source: "notes"

  - resourceId: "demo:reports"
    intentClasses: ["LOOKUP", "QUERY", "INGEST", "REVISE"]
    version: 1
    description: "Business reports stored on the local filesystem — write access restricted to admin role"
    backendId: "localfs_demo"
    sourceDefinition:
      source: "reports"
