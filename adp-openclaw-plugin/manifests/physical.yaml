# ADP Physical Manifest - Storage backend definitions
#
# The `uri` below is relative and resolves from the Hypervisor's working
# directory (CWD).  For production, either create a `data/` directory next
# to your manifests' parent, or override `uri` with an absolute path.

version: "1.0.0"

backends:
  - id: "release_storage"
    type: "BLOB_STORAGE"
    provider: "local"
    config:
      type: "BLOB_STORAGE"
      uri: "./data"
