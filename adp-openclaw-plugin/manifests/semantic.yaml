# ADP Semantic Manifest - Release domain resource definitions
# Deploy path: ~/adp-demo/adp-release-manifest/semantic.yaml
#
# Backend is BLOB_STORAGE (local filesystem).  Each resource maps to a
# subdirectory under `data/<source>/`.
#
# Convention-based metadata fields (path, size, last_modified, created_at,
# content_type, is_directory, content, content_encoding) are provided
# automatically by the blob storage backend — do NOT list them here.

version: "1.0.0"

resources:
  - resourceId: "release:releases"
    intentClasses: ["LOOKUP", "QUERY", "INGEST", "REVISE"]
    version: 1
    description: "Apache Gravitino release tracking records (JSON files)"
    backendId: "release_storage"
    sourceDefinition:
      source: "releases"

  - resourceId: "release:checklist"
    intentClasses: ["LOOKUP", "QUERY", "INGEST", "REVISE"]
    version: 1
    description: "Release checklist items with completion status (JSON files)"
    backendId: "release_storage"
    sourceDefinition:
      source: "checklist"

  - resourceId: "release:candidates"
    intentClasses: ["LOOKUP", "QUERY", "INGEST", "REVISE"]
    version: 1
    description: "Release candidate build records (JSON files)"
    backendId: "release_storage"
    sourceDefinition:
      source: "candidates"

  - resourceId: "release:votes"
    intentClasses: ["LOOKUP", "QUERY", "INGEST"]
    version: 1
    description: "PMC vote tracking for release candidates (JSON files)"
    backendId: "release_storage"
    sourceDefinition:
      source: "votes"

  - resourceId: "system:people"
    intentClasses: ["LOOKUP", "QUERY"]
    version: 1
    description: "Project member directory with roles (CSV)"
    backendId: "release_storage"
    sourceDefinition:
      source: "people"
