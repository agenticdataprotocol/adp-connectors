name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (adp-mcp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: adp-mcp
        run: uv sync --extra dev

      - name: Run Ruff
        working-directory: adp-mcp
        run: uv run ruff check .

      - name: Run Black
        working-directory: adp-mcp
        run: uv run black --check .

      - name: Run mypy
        working-directory: adp-mcp
        run: uv run mypy src/

  test:
    name: Test (adp-mcp) / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: adp-mcp
        run: uv sync --extra dev

      - name: Run tests
        working-directory: adp-mcp
        run: uv run python -m unittest discover -s tests -v
